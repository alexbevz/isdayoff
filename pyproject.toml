[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isdayoff-api"
description = "Checking the date for belonging to a non-working day, according to official decrees and orders."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
version = "1.0.2"
authors = [
    { name = "Aleksandr Bevz", email = "as-bivz@yandex.ru" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx >= 0.28",
    "pydantic >= 2",
]
urls = { Homepage = "https://github.com/asbevz/isdayoff", Source = "https://github.com/asbevz/isdayoff" }

[tool.hatch.build.targets.sdist]
include = ["/isdayoff", "/tests"]

[tool.hatch.build.targets.wheel]
packages = ["isdayoff"]

[dependency-groups]
dev = [
    "pytest >= 8",
    "pytest-asyncio >= 0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the real isdayoff.ru API",
]
